[package]
name = "herdr-axi"
version = "0.1.0"
edition = "2024"
description = "AXI-discipline wrapper around the herdr multiplexer CLI"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[lib]
name = "herdr_axi"
path = "src/lib.rs"

[[bin]]
name = "herdr-axi"
path = "src/main.rs"
